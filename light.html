<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九宮格反應測試</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
text-align:center;
width:90%;
max-width:700px;
}

h1{
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin:30px auto;
max-width:450px;
}

.cell{
aspect-ratio:1;
background:#334155;
border-radius:15px;
cursor:pointer;
transition:.2s;
}

.active{
background:#22c55e;
box-shadow:0 0 20px #22c55e;
}

.info{
font-size:22px;
margin:10px;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}

#result{
margin-top:20px;
font-size:24px;
font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<h1>⚡ 九宮格反應測試</h1>

<div class="info">
回合：
<span id="round">0</span>/10
</div>

<div class="grid" id="grid"></div>

<div id="result"></div>

<button onclick="startGame()">
開始遊戲
</button>

</div>

<script>

const grid =
document.getElementById("grid");

const roundText =
document.getElementById("round");

const result =
document.getElementById("result");

let currentCell = -1;

let startTime = 0;

let round = 0;

let reactionTimes = [];

let active = false;

for(let i=0;i<9;i++){

const cell =
document.createElement("div");

cell.className = "cell";

cell.dataset.index = i;

cell.addEventListener("click",()=>{

if(
active &&
Number(cell.dataset.index) === currentCell
){

const reaction =
Date.now() - startTime;

reactionTimes.push(reaction);

active = false;

cell.classList.remove("active");

nextRound();
}
});

grid.appendChild(cell);
}

function startGame(){

round = 0;

reactionTimes = [];

result.innerHTML = "";

nextRound();
}

function nextRound(){

round++;

roundText.textContent = round-1;

if(round > 10){

finishGame();

return;
}

const delay =
Math.random()*2500 + 500;

setTimeout(()=>{

const cells =
document.querySelectorAll(".cell");

cells.forEach(c=>
c.classList.remove("active")
);

currentCell =
Math.floor(Math.random()*9);

cells[currentCell]
.classList.add("active");

startTime =
Date.now();

active = true;

roundText.textContent = round;

},delay);
}

function finishGame(){

const avg =
Math.round(

reactionTimes.reduce(
(a,b)=>a+b,0
)
/
reactionTimes.length

);

if(avg < 500){

result.innerHTML =
`
平均反應時間：
${avg} ms
<br><br>
✅ 過關
`;
}
else{

result.innerHTML =
`
平均反應時間：
${avg} ms
<br><br>
❌ 未過關
`;
}
}

</script>

</body>
</html>
