<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反應速度測試</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#1e293b;
color:white;
text-align:center;
}

.container{
width:90%;
max-width:600px;
}

#gameArea{
margin-top:20px;
padding:60px;
border-radius:20px;
background:#ef4444;
cursor:pointer;
transition:.2s;
user-select:none;
}

.green{
background:#22c55e !important;
}

h1{
margin-bottom:20px;
}

#result{
margin-top:20px;
font-size:24px;
font-weight:bold;
}

button{
margin-top:20px;
padding:12px 24px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>
</head>
<body>

<div class="container">

<h1>⚡ 反應速度測試</h1>

<p id="message">
點擊開始後等待畫面變綠
</p>

<div id="gameArea">
點擊開始
</div>

<div id="result"></div>

<button onclick="startGame()">
重新開始
</button>

</div>

<script>

const gameArea =
document.getElementById("gameArea");

const message =
document.getElementById("message");

const result =
document.getElementById("result");

let startTime;
let waiting = false;
let canClick = false;
let timer;

function startGame(){

clearTimeout(timer);

result.innerHTML = "";

gameArea.classList.remove("green");

gameArea.innerHTML = "等待變綠...";

message.innerHTML =
"不要太早點擊！";

waiting = true;
canClick = false;

const delay =
Math.random()*3000 + 2000;

timer = setTimeout(()=>{

gameArea.classList.add("green");

gameArea.innerHTML =
"立即點擊！";

startTime = Date.now();

canClick = true;
waiting = false;

},delay);
}

gameArea.addEventListener("click",()=>{

if(canClick){

const reaction =
Date.now() - startTime;

result.innerHTML =
`你的反應時間：${reaction} ms`;

if(reaction < 500){

result.innerHTML +=
"<br>✅ 過關！";
}
else{

result.innerHTML +=
"<br>❌ 未過關";
}

canClick = false;

gameArea.classList.remove("green");

gameArea.innerHTML =
"測試完成";
}

else if(waiting){

clearTimeout(timer);

result.innerHTML =
"❌ 太早點擊了！";

gameArea.innerHTML =
"請重新開始";

waiting = false;
}
});

</script>

</body>
</html>
