<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ 極限反應挑戰</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1000px;
    text-align:center;
}

h1{
    margin-bottom:15px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.card{
    background:#1e293b;
    padding:10px 18px;
    border-radius:10px;
    font-size:18px;
    min-width:120px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(9,1fr);
    gap:4px;
    max-width:900px;
    margin:auto;
}

.cell{
    aspect-ratio:1;
    background:#334155;
    border-radius:4px;
    cursor:pointer;
    transition:.12s;
}

.green{
    background:#22c55e;
    box-shadow:
        0 0 10px #22c55e,
        0 0 20px #22c55e;
}

.bomb{
    background:#ff0000;
    box-shadow:
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 35px #ff0000;
    animation:pulse .4s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
}

button{
    padding:12px 24px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
}

#result{
    display:none;
    margin-top:25px;
    font-size:22px;
    line-height:1.8;
}

.instructions{
    margin-bottom:15px;
    color:#cbd5e1;
}
</style>
</head>
<body>

<div class="container">

<h1>⚡ 極限反應挑戰</h1>

<div class="instructions">
🟩 點綠色 +5 分　
💣 點紅色 -5 分　
⏱️ 遊戲時間 60 秒
</div>

<div class="stats">
    <div class="card">⏱️ <span id="time">60</span>s</div>
    <div class="card">⭐ 分數 <span id="score">0</span></div>
    <div class="card">🟩 命中 <span id="hits">0</span></div>
    <div class="card">💣 炸彈 <span id="bombs">0</span></div>
</div>

<div class="grid" id="grid"></div>

<button id="startBtn">開始遊戲</button>

<div id="result"></div>

</div>

<script>

const grid = document.getElementById("grid");
const startBtn = document.getElementById("startBtn");

const timeEl = document.getElementById("time");
const scoreEl = document.getElementById("score");
const hitsEl = document.getElementById("hits");
const bombsEl = document.getElementById("bombs");

let score = 0;
let hits = 0;
let bombHits = 0;

let timeLeft = 60;
let elapsed = 0;

let gameStarted = false;
let gameEnded = false;

let countdown;
let spawnLoop;

const cells = [];

/* 建立81格 */

for(let i=0;i<81;i++){

    const cell = document.createElement("div");
    cell.className = "cell";

    cell.addEventListener("click",()=>{

        if(gameEnded) return;

        if(cell.classList.contains("green")){

            score += 5;
            hits++;

            cell.classList.remove("green");

            updateUI();
        }

        else if(cell.classList.contains("bomb")){

            score -= 5;
            bombHits++;

            cell.classList.remove("bomb");

            updateUI();
        }

    });

    grid.appendChild(cell);
    cells.push(cell);
}

/* UI */

function updateUI(){

    scoreEl.textContent = score;
    hitsEl.textContent = hits;
    bombsEl.textContent = bombHits;
}

/* 難度曲線 */

function getSpawnSpeed(){

    const progress = elapsed / 60;

    return Math.max(
        120,
        1000 - progress * 850
    );
}

function getLifeTime(){

    const progress = elapsed / 60;

    return Math.max(
        250,
        1000 - progress * 700
    );
}

function getBombChance(){

    const progress = elapsed / 60;

    return 0.30 + progress * 0.35;
}

/* 隨機產生 */

function spawnOne(){

    if(gameEnded) return;

    let index =
        Math.floor(Math.random() * 81);

    let cell = cells[index];

    if(
        cell.classList.contains("green") ||
        cell.classList.contains("bomb")
    ){
        return;
    }

    const isBomb =
        Math.random() < getBombChance();

    if(isBomb){
        cell.classList.add("bomb");
    }
    else{
        cell.classList.add("green");
    }

    setTimeout(()=>{

        cell.classList.remove("green");
        cell.classList.remove("bomb");

    },getLifeTime());
}

/* 遊戲主循環 */

function gameSpawner(){

    if(gameEnded) return;

    spawnOne();

    if(elapsed > 20){
        spawnOne();
    }

    if(elapsed > 40){
        spawnOne();
    }

    spawnLoop =
        setTimeout(
            gameSpawner,
            getSpawnSpeed()
        );
}

/* 開始 */

function startGame(){

    if(gameStarted) return;

    gameStarted = true;

    startBtn.disabled = true;

    gameSpawner();

    countdown = setInterval(()=>{

        timeLeft--;
        elapsed++;

        timeEl.textContent = timeLeft;

        if(timeLeft <= 0){
            endGame();
        }

    },1000);
}

/* 評價 */

function getRank(){

    if(score >= 500){
        return "🏆 S級 神級反應";
    }

    if(score >= 350){
        return "🥇 A級 超強";
    }

    if(score >= 220){
        return "🥈 B級 優秀";
    }

    if(score >= 120){
        return "🥉 C級 不錯";
    }

    return "🙂 D級 再接再厲";
}

/* 結束 */

function endGame(){

    gameEnded = true;

    clearInterval(countdown);
    clearTimeout(spawnLoop);

    document
    .querySelectorAll(".cell")
    .forEach(c=>{

        c.classList.remove("green");
        c.classList.remove("bomb");

    });

    const accuracy =
        (hits + bombHits) === 0
        ? 0
        : Math.round(
            hits /
            (hits + bombHits)
            * 100
        );

    const result =
        document.getElementById("result");

    result.style.display = "block";

    result.innerHTML = `
        <h2>🏁 遊戲結束</h2>

        ⭐ 最終分數：${score}<br>

        🟩 命中綠格：${hits}<br>

        💣 點到炸彈：${bombHits}<br>

        🎯 準確率：${accuracy}%<br>

        ${getRank()}<br><br>

        <button onclick="location.reload()">
            再玩一次
        </button>
    `;
}

startBtn.addEventListener("click",startGame);

updateUI();

</script>

</body>
</html>
