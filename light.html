<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 心靈機掏提問器</title>

<style>
body{
    margin:0;
    font-family:"Microsoft JhengHei",sans-serif;
    background:linear-gradient(135deg,#1e1e2f,#2d3250);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:700px;
    text-align:center;
    background:rgba(255,255,255,0.08);
    padding:30px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 30px rgba(0,0,0,0.3);
}

h1{
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:120px;
    border:none;
    border-radius:12px;
    padding:15px;
    font-size:18px;
    resize:none;
    box-sizing:border-box;
}

select{
    margin-top:15px;
    padding:10px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#7c5cff;
    color:white;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

#answerBox{
    margin-top:30px;
    min-height:150px;
}

.answer{
    font-size:24px;
    line-height:1.8;
    animation:fadeIn 0.8s;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🔮 心靈機掏提問器</h1>

<p>把你的煩惱交給宇宙。</p>

<textarea id="worry" placeholder="例如：我明天要考試但完全不想讀書"></textarea>

<br>

<select id="mode">
    <option value="wisdom">🔮 心靈雞湯模式</option>
    <option value="nonsense">🤡 幹話模式</option>
    <option value="master">🧙 大師模式</option>
</select>

<br>

<button onclick="generateAnswer()">
    獲得啟示
</button>

<div id="answerBox"></div>

</div>

<script>

const wisdom = [
"🌿 風不會問樹葉為什麼掉下來。",
"☁️ 雲知道自己是雲，所以從不著急。",
"🌊 海浪來了又走，煩惱也是。",
"🌙 月亮有陰晴圓缺，但還是月亮。",
"🍃 葉子落下並不是失敗，而是季節。",
"🐢 烏龜很慢，但牠從不懷疑自己。",
"⭐ 星星白天看不見，但依然存在。",
"🌈 雨下夠了，彩虹才知道何時出場。",
"🌱 種子埋在土裡時，也不知道自己會開花。",
"🕊️ 有些答案不是找到的，而是等到的。"
];

const nonsense = [
"🤡 你的問題很好，但我是馬鈴薯。",
"🦆 有些鴨子會飛，有些只會嘎嘎叫。",
"🍜 拉麵不會因為你難過而變鹹。",
"🧦 失蹤的襪子可能只是想放假。",
"🐱 貓咪從來不解釋牠的決定。",
"🍉 西瓜不知道自己是圓的。",
"🥔 馬鈴薯也曾有夢想。",
"🦖 如果恐龍還活著，牠大概也很煩。",
"🍞 麵包從來不擔心明天。",
"🐔 雞不知道為什麼過馬路，但牠還是過去了。"
];

const master = [
"🧙 真正的答案不在問題裡。",
"🧙 當你想知道答案時，答案也正在想你。",
"🧙 不要追逐答案，讓答案追逐你。",
"🧙 問題之所以存在，是因為你發現了它。",
"🧙 今天的困惑，是明天的迷惑。",
"🧙 真理藏在重新整理按鈕後面。",
"🧙 若你看見道路，道路便不是道路。",
"🧙 有些門打開之前，本來就是開著的。",
"🧙 你以為你在思考，其實思考也在思考你。",
"🧙 沒有人能回答所有問題，包括這一句。"
];

function randomItem(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function generateAnswer(){

    const worry = document.getElementById("worry").value.trim();

    if(worry === ""){
        alert("請先輸入你的煩惱！");
        return;
    }

    const mode = document.getElementById("mode").value;

    let result = "";

    if(mode === "wisdom"){
        result = randomItem(wisdom);
    }
    else if(mode === "nonsense"){
        result = randomItem(nonsense);
    }
    else{
        result = randomItem(master);
    }

    document.getElementById("answerBox").innerHTML = `
        <div class="answer">
            <h2>🔮 宇宙收到你的煩惱：</h2>
            <p>「${worry}」</p>
            <hr>
            <h2>✨ 啟示：</h2>
            <p>${result}</p>
        </div>
    `;
}

</script>

</body>
</html>
