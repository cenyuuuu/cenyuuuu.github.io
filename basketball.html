<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>移動投籃挑戰</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    width:95%;
    max-width:900px;
}

h1{
    margin-bottom:20px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:10px 20px;
    border-radius:12px;
}

canvas{
    background:#dbeafe;
    border-radius:16px;
    border:4px solid white;
    width:100%;
    max-width:800px;
}

button{
    padding:12px 24px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:20px;
    font-size:18px;
}

#result{
    display:none;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏀 移動投籃挑戰</h1>

<div class="stats">
    <div class="card">
        剩餘球數：
        <span id="balls">10</span>
    </div>

    <div class="card">
        命中：
        <span id="hits">0</span>
    </div>
</div>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<p style="margin-top:15px;">
點擊畫面發射籃球
</p>

<div id="result">
    <h2 id="finalText"></h2>
    <button onclick="restartGame()">
        再玩一次
    </button>
</div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let basketX = 300;
let basketDirection = 1;
let basketSpeed = 4;

let ball = null;

let shotsLeft = 10;
let hits = 0;

let gameOver = false;

canvas.addEventListener("click",(e)=>{

    if(gameOver) return;
    if(ball) return;
    if(shotsLeft<=0) return;

    const rect = canvas.getBoundingClientRect();

    const clickX =
        (e.clientX - rect.left) *
        (canvas.width / rect.width);

    ball = {
        x: canvas.width/2,
        y: canvas.height-50,
        vx:(clickX-canvas.width/2)/30,
        vy:-10
    };

    shotsLeft--;

    document.getElementById("balls").textContent =
        shotsLeft;
});

function update(){

    basketX += basketSpeed * basketDirection;

    if(basketX < 40 || basketX > 660){
        basketDirection *= -1;
    }

    if(ball){

        ball.x += ball.vx;
        ball.y += ball.vy;

        ball.vy += 0.3;

        if(
            ball.x > basketX &&
            ball.x < basketX+100 &&
            ball.y > 70 &&
            ball.y < 95
        ){

            hits++;

            document.getElementById("hits").textContent =
                hits;

            ball = null;
        }

        if(ball && ball.y > canvas.height){
            ball = null;
        }
    }

    if(
        shotsLeft===0 &&
        ball===null &&
        !gameOver
    ){
        finishGame();
    }

    draw();

    requestAnimationFrame(update);
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // 地面
    ctx.fillStyle="#94a3b8";

    ctx.fillRect(
        0,
        canvas.height-20,
        canvas.width,
        20
    );

    // 籃框
    ctx.fillStyle="red";

    ctx.fillRect(
        basketX,
        80,
        100,
        10
    );

    // 籃網
    ctx.strokeStyle="white";

    ctx.beginPath();
    ctx.moveTo(basketX,90);
    ctx.lineTo(basketX+15,120);

    ctx.moveTo(basketX+25,90);
    ctx.lineTo(basketX+35,120);

    ctx.moveTo(basketX+50,90);
    ctx.lineTo(basketX+50,120);

    ctx.moveTo(basketX+75,90);
    ctx.lineTo(basketX+65,120);

    ctx.moveTo(basketX+100,90);
    ctx.lineTo(basketX+85,120);

    ctx.stroke();

    // 球
    if(ball){

        ctx.fillStyle="orange";

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            12,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    // 發球位置
    ctx.fillStyle="#f97316";

    ctx.beginPath();

    ctx.arc(
        canvas.width/2,
        canvas.height-40,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();
}

function finishGame(){

    gameOver = true;

    const rate =
        Math.round((hits/10)*100);

    document.getElementById("result")
        .style.display="block";

    let rank="";

    if(rate>=80){
        rank="🏆 神射手";
    }
    else if(rate>=60){
        rank="🔥 很厲害";
    }
    else if(rate>=40){
        rank="👍 不錯";
    }
    else{
        rank="😆 再練練";
    }

    document.getElementById("finalText")
        .innerHTML=
        `
        命中 ${hits}/10 球<br>
        命中率 ${rate}%<br><br>
        ${rank}
        `;
}

function restartGame(){

    shotsLeft=10;
    hits=0;
    ball=null;
    gameOver=false;

    document.getElementById("balls")
        .textContent=10;

    document.getElementById("hits")
        .textContent=0;

    document.getElementById("result")
        .style.display="none";
}

update();

</script>

</body>
</html>
